<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6b3a">
<title>Beskärningshjälpen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌿 Beskärningshjälpen</h1>
  <input id="q" type="search" placeholder="Sök växt eller månad, t.ex. rosor eller april" autocomplete="off" aria-label="Sök">
  <div id="months" class="chips" role="group" aria-label="Månad"></div>
  <div class="row">
    <select id="group" aria-label="Växtgrupp"></select>
    <select id="zone" aria-label="Odlingszon"></select>
    <span id="count"></span>
  </div>
</header>
<details id="guide" class="card guide"><summary><div class="name">✂️ Så beskär du: enkla bilder</div><div class="tag">Fem grundmetoder som används i listan</div></summary>
<div class="figs">
<figure><svg viewBox="0 0 240 130" role="img" aria-label="Snitt ovanför knopp: rätt och fel">
<line x1="60" y1="120" x2="60" y2="38" stroke="#8a6a3b" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="68" cy="58" rx="5" ry="8" fill="#2f9e44"/>
<line x1="53" y1="38" x2="67" y2="28" stroke="#d62828" stroke-width="3" stroke-linecap="round"/>
<text x="60" y="14" text-anchor="middle" font-size="11" fill="currentColor">Rätt</text>
<line x1="180" y1="120" x2="180" y2="20" stroke="#8a6a3b" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="188" cy="92" rx="5" ry="8" fill="#2f9e44"/>
<line x1="173" y1="20" x2="187" y2="20" stroke="#d62828" stroke-width="3" stroke-linecap="round"/>
<text x="180" y="12" text-anchor="middle" font-size="11" fill="currentColor">Fel: för lång stump</text></svg>
<figcaption><b>Snitt ovanför knopp.</b> Skär snett, cirka 5 mm ovanför en knopp som pekar åt det håll du vill att grenen ska växa. Snittet lutar bort från knoppen.</figcaption></figure>
<figure><svg viewBox="0 0 240 130" role="img" aria-label="Tunna ut vid basen">
<line x1="20" y1="118" x2="220" y2="118" stroke="#8a6a3b" stroke-width="3"/>
<g stroke-width="5" stroke-linecap="round" fill="none"><path d="M80 118 L60 25" stroke="#2f9e44"/><path d="M95 118 L100 20" stroke="#2f9e44"/><path d="M110 118 L145 28" stroke="#2f9e44"/><path d="M125 118 L190 40" stroke="#2f9e44"/><path d="M70 118 L25 50" stroke="#777" stroke-width="9"/></g>
<line x1="38" y1="108" x2="64" y2="98" stroke="#d62828" stroke-width="3" stroke-dasharray="4 3"/>
<text x="120" y="14" text-anchor="middle" font-size="11" fill="currentColor">Den gamla, grå grenen tas bort vid marken</text></svg>
<figcaption><b>Tunna ut vid basen.</b> Skär bort de äldsta grenarna helt vid marken så att busken förnyas och blir luftig.</figcaption></figure>
<figure><svg viewBox="0 0 240 130" role="img" aria-label="Ner till marken">
<line x1="10" y1="118" x2="230" y2="118" stroke="#8a6a3b" stroke-width="3"/>
<g stroke="#2f9e44" stroke-width="5" stroke-linecap="round"><path d="M30 118 L24 30"/><path d="M48 118 L52 22"/><path d="M66 118 L78 36"/></g>
<path d="M95 70 L140 70 M130 62 L140 70 L130 78" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
<g stroke="#8a6a3b" stroke-width="5" stroke-linecap="round"><path d="M170 118 L170 98"/><path d="M188 118 L188 98"/><path d="M206 118 L206 98"/></g>
<line x1="160" y1="96" x2="216" y2="96" stroke="#d62828" stroke-width="3" stroke-dasharray="4 3"/>
<text x="120" y="14" text-anchor="middle" font-size="11" fill="currentColor">Före → efter (20–30 cm kvar)</text></svg>
<figcaption><b>Ner till marken.</b> Skär ner alla skott till 20–30 cm. Används på växter som blommar på årsskott, till exempel buskhortensia och buddleja.</figcaption></figure>
<figure><svg viewBox="0 0 240 130" role="img" aria-label="Häckklippning">
<line x1="10" y1="120" x2="230" y2="120" stroke="#8a6a3b" stroke-width="3"/>
<path d="M25 120 L45 30 L85 30 L105 120 Z" fill="#2f9e44"/>
<path d="M135 120 L135 30 L205 30 L205 120 Z" fill="#7a8f7a"/>
<rect x="135" y="85" width="70" height="35" fill="#a0885a"/>
<text x="65" y="17" text-anchor="middle" font-size="11" fill="currentColor">Rätt: bredare nederst</text>
<text x="170" y="17" text-anchor="middle" font-size="11" fill="currentColor">Fel: nedre delen blir kal</text></svg>
<figcaption><b>Häckklippning.</b> Klipp trapetsformat, smalare uppåt, så att ljuset når hela häcken. Klipp inte in i gammal bar ved på barrväxter.</figcaption></figure>
<figure><svg viewBox="0 0 240 130" role="img" aria-label="Ta bort död eller korsande ved">
<path d="M120 122 L120 60" stroke="#8a6a3b" stroke-width="9" stroke-linecap="round"/>
<path d="M120 80 L65 35" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>
<path d="M120 80 L175 35" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>
<path d="M120 100 L60 82" stroke="#777" stroke-width="5" stroke-linecap="round"/>
<path d="M120 62 L100 30" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>
<path d="M120 70 L160 90 L195 60" stroke="#2f9e44" stroke-width="5" fill="none" stroke-linecap="round"/>
<g stroke="#d62828" stroke-width="3" stroke-linecap="round"><path d="M50 74 L64 90 M64 74 L50 90"/><path d="M185 70 L199 84 M199 70 L185 84"/></g>
<text x="60" y="108" text-anchor="middle" font-size="10" fill="currentColor">död</text>
<text x="192" y="100" text-anchor="middle" font-size="10" fill="currentColor">korsar/inåt</text></svg>
<figcaption><b>Ta bort död och korsande ved.</b> Ta bort döda, sjuka, inåtväxande, korsande och skavande grenar samt vattenskott. Skär vid grenkragen.</figcaption></figure>
</div></details>
<main id="list"></main>
<footer>Egna sammanfattningar som riktlinjer. Anpassa efter din zon, växtens ålder och väder.</footer>
<script src="plants.js"></script>
<script src="app.js"></script>
</body>
</html>
